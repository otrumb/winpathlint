name: Windows release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
      GIT_MASTER: '1'
      RELEASE_TAG: ${{ github.ref_name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Quality gates
        run: |
          $files = @(gofmt -l .)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($files.Count -gt 0) { $files; exit 1 }
          go test -shuffle=on -count=1 -cover ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and verify both architectures
        run: ./scripts/test-package.ps1 -Version $env:RELEASE_TAG -OutputDirectory "$env:RUNNER_TEMP/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-release
          path: release
      - name: Publish verified assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Invalid release tag' }
          $assets = @("release/winpathlint_$($env:RELEASE_TAG)_windows_amd64.zip", "release/winpathlint_$($env:RELEASE_TAG)_windows_arm64.zip")
          $manifest = @(Get-Content -LiteralPath release/SHA256SUMS)
          if ($manifest.Count -ne 2) { throw 'Expected two checksums' }
          foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
            if ($manifest -cnotcontains "$hash  $([IO.Path]::GetFileName($asset))") { throw "Checksum mismatch: $asset" }
          }
          $releaseJson = gh api "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG" 2>&1
          $releaseStatus = $LASTEXITCODE
          if ($releaseStatus -eq 0) {
            try { $release = $releaseJson | ConvertFrom-Json } catch { throw "Could not parse existing release response: $releaseJson" }
            if (-not $release.draft) { throw "Release $env:RELEASE_TAG is already published; refusing overwrite" }
            $releaseId = [string]$release.id
          } elseif ($releaseJson -match '\(HTTP 404\)|HTTP 404') {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title $env:RELEASE_TAG --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $releaseJson = gh api "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            try { $release = $releaseJson | ConvertFrom-Json } catch { throw "Could not parse created release response: $releaseJson" }
            $releaseId = [string]$release.id
          } else {
            throw "Could not inspect release $env:RELEASE_TAG (gh api exit code $releaseStatus): $releaseJson"
          }
          foreach ($asset in @($assets + 'release/SHA256SUMS')) {
            gh release upload $env:RELEASE_TAG $asset --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $uploaded = gh api "repos/$env:GH_REPO/releases/$releaseId/assets"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try { $uploadedAssets = @($uploaded | ConvertFrom-Json) } catch { throw "Could not parse release assets response: $uploaded" }
          $expectedNames = @($assets | ForEach-Object { [IO.Path]::GetFileName($_) }) + 'SHA256SUMS'
          $actualNames = @($uploadedAssets | ForEach-Object { $_.name })
          if (($actualNames | Where-Object { $expectedNames -notcontains $_ }).Count -gt 0 -or
              ($expectedNames | Where-Object { $actualNames -notcontains $_ }).Count -gt 0) {
            throw 'Release assets do not exactly match expected assets'
          }
          gh release edit $env:RELEASE_TAG --draft=false --verify-tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
